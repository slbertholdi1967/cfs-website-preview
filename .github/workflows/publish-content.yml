# Runs after every publish from CFS Core (Website projects): CFS Core commits content/projects.json and new original
# photos; this job enhances the photos, rebuilds the pages and commits them. GitHub Pages then serves the result.
# Also runs when the database sends the Jobs map (repository_dispatch "jobs-map": Job name, city, state, ZIP and an
# address code only, owner decisions 174-177).
name: Publish content from CFS Core

on:
  push:
    branches: [main]
    paths: ["content/**"]
  repository_dispatch:
    types: [jobs-map]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save the Jobs map sent by the database
        if: github.event_name == 'repository_dispatch'
        env:
          JOBS: ${{ toJson(github.event.client_payload.jobs) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          raw = json.loads(os.environ["JOBS"] or "[]")
          keep = []
          for j in raw if isinstance(raw, list) else []:
              if not isinstance(j, dict):
                  continue
              row = {k: (str(j[k])[:160] if j.get(k) is not None else None) for k in ("name", "city", "state", "zip", "site")}
              if row["name"] and row["city"] and row["state"] and re.fullmatch(r"[A-Z]{2}", row["state"]):
                  keep.append(row)
          with open("data/jobs-map.json", "w", encoding="utf-8") as f:
              json.dump(keep, f, indent=1, ensure_ascii=False)
              f.write("\n")
          print("jobs on the map:", len(keep))
          PY
      - name: Install photo tools
        run: pip install --quiet opencv-python-headless numpy pillow pillow-heif
      - name: Import projects from CFS Core
        run: python3 tools/import_content.py
      - name: Build pages
        run: python3 build.py
      - name: Commit the website
        run: |
          git config user.name "cfs-website-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Website: import projects published from CFS Core"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: Ask GitHub Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own"
